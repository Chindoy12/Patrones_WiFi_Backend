server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: wifisense-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  web:
    locale: es
    locale-resolver: fixed
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none  # schema is owned by WiFiSense-database migrations
    properties:
      hibernate.jdbc.time_zone: UTC

management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true

wifisense:
  security:
    jwt-secret: ${JWT_SECRET}
    token-ttl: ${JWT_TTL:8h}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    plain-passwords-allowed: ${PLAIN_PASSWORDS_ALLOWED:true}  # false = only sealed passwords from the web app
  accounts:
    admin-username: ${ADMIN_USERNAME:}
    admin-password: ${ADMIN_PASSWORD:}
    max-users: 3
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${AI_API_KEY:}
    timeout: 10s
  monitoring:
    enabled: ${MONITORING_ENABLED:true}
    tick: PT30S
  analysis:
    window-size: 50
  speedtest:  # connection test of Mi Wi-Fi; downloads are billed as egress, so keep them small
    max-download: 8MB
    max-upload: 8MB
    transfers-per-window: 20
    tests-per-window: 6
    window: 10m
  mail:  # recovery email through Brevo's HTTP API; without BREVO_API_KEY and MAIL_FROM nothing is sent
    brevo-api-key: ${BREVO_API_KEY:}
    from: ${MAIL_FROM:}
    from-name: WiFiSense
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    reset-ttl: 30m
    log-links: ${MAIL_LOG_LINKS:false}  # true only for local development: prints the link instead of sending it
  agent:  # WiFiSense agent of the end users (Mi Wi-Fi > Agente)
    min-interval: 50s     # the agent reports every 5 min; faster reports are rejected with 429
    retention: 30d        # older reports and devices are deleted every night
    online-window: 15m
    analysis-window: 20   # reports the anomaly detection receives as context
    history-size: 48
  data-sources:
    simulation:
      anomaly-probability: 0.1
    system-probe:
      host: 1.1.1.1
      port: 443
      attempts: 5
      timeout: 1s

logging:
  level:
    com.wifisense: INFO
