server:
  port: ${PORT:8080}
  shutdown: graceful  # a redeploy lets the requests in progress finish
  error:
    include-message: never
    include-stacktrace: never
  compression:  # JSON lists travel several times smaller; the speed test (application/octet-stream) is never compressed
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 2KB

spring:
  application:
    name: wifisense-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      connection-timeout: 10000  # ms: fail fast instead of keeping a request waiting 30 s for a connection
  lifecycle:
    timeout-per-shutdown-phase: 20s
  web:
    locale: es
    locale-resolver: fixed
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none  # schema is owned by WiFiSense-database migrations
    properties:
      hibernate.jdbc.time_zone: UTC

management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true

wifisense:
  security:
    jwt-secret: ${JWT_SECRET}
    token-ttl: ${JWT_TTL:15m}  # access token; the web app renews it with the refresh token before it expires
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    plain-passwords-allowed: ${PLAIN_PASSWORDS_ALLOWED:true}  # false = only sealed passwords from the web app
  session:
    refresh-ttl: ${SESSION_REFRESH_TTL:14d}  # a session unused for this long has to sign in again
  retention:
    monitoring: ${MONITORING_RETENTION:90d}  # measurements, traffic and analyses of the team's networks
  accounts:
    admin-username: ${ADMIN_USERNAME:}
    admin-password: ${ADMIN_PASSWORD:}
    max-users: 3
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${AI_API_KEY:}
    timeout: 10s
    circuit:  # Proxy with Circuit Breaker: after this many failures in a row, calls fail at once for open-for
      failures: 2
      open-for: 30s
    training:  # the anomaly model trained with the real measurements (sensors and agents)
      automatic: ${AI_TRAINING_AUTOMATIC:true}  # every week; the new model is used only if it is better
      cron: "0 0 3 * * MON"
      zone: America/Bogota
  monitoring:
    enabled: ${MONITORING_ENABLED:true}
    tick: PT30S
  analysis:
    window-size: 50
  speedtest:  # connection test of Mi Wi-Fi; downloads are billed as egress, so keep them small
    max-download: 8MB
    max-upload: 8MB
    transfers-per-window: 20
    tests-per-window: 6
    window: 10m
  mail:  # recovery email through Brevo's HTTP API; without BREVO_API_KEY and MAIL_FROM nothing is sent
    brevo-api-key: ${BREVO_API_KEY:}
    from: ${MAIL_FROM:}
    from-name: WiFiSense
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    reset-ttl: 30m
    log-links: ${MAIL_LOG_LINKS:false}  # true only for local development: prints the link instead of sending it
  agent:  # WiFiSense agent of the end users (Mi Wi-Fi > Agente)
    min-interval: 50s     # the agent reports every 5 min; faster reports are rejected with 429
    retention: 30d        # older reports and devices are deleted every night
    online-window: 15m
    analysis-window: 20   # reports the anomaly detection receives as context
    history-size: 48
  scan:  # nearby Wi-Fi networks seen by the agent of Mi Wi-Fi (Redes cercanas)
    scheduled-interval: 60m      # the server asks for a scan when the last one is older than this
    manual-min-interval: 30s     # "Escanear ahora" at most this often
    agent-timeout: 3m            # a scan not finished by the agent in this time fails (AGENT_NO_RESPONSE)
    poll-min-interval: 10s       # the agent asks for pending scans every 30 s; faster is rejected with 429
    stale-after: 150m            # the page marks the last result as out of date after this
    max-access-points: 200       # strongest access points kept from one scan
    retention: 30d               # scans (and their observations) deleted every night after this
    access-point-retention: 90d  # access points not seen for this long are deleted
  capture:  # technical captures of the team networks, run by their sensor (only an ADMIN asks for them)
    default-seconds: 30          # what the form proposes
    default-packets: 5000
    max-seconds: ${CAPTURE_MAX_SECONDS:120}    # the most an administrator may ask (the table accepts up to 300)
    max-packets: ${CAPTURE_MAX_PACKETS:20000}  # (the table accepts up to 100 000)
    max-bytes: 20MB              # (the table accepts up to 100 MB)
    start-timeout: 3m            # a capture the sensor does not pick up in this time fails (AGENT_NO_RESPONSE)
    result-grace: 90s            # once started, the sensor has the capture's duration plus this to deliver it
    poll-min-interval: 10s       # the sensor asks for pending captures every 30 s; faster is rejected with 429
    min-agent-version: 2.0.0     # the first agent that can capture
    retention: ${CAPTURE_RETENTION:90d}  # captures (statistics and findings) deleted every night after this
  audit:  # audit of the sensitive operations (Auditoría)
    retention: ${AUDIT_RETENTION:365d}  # never less than 31 days: the table refuses to delete younger rows
  data-sources:
    demo-enabled: ${DEMO_DATA_SOURCES:false}  # true only for local demos: simulated networks and the server's own probe
    simulation:
      anomaly-probability: 0.1
    system-probe:
      host: 1.1.1.1
      port: 443
      attempts: 5
      timeout: 1s

logging:
  level:
    com.wifisense: INFO
